name: Deploy Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI (build/test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  docker:
    name: Build Docker and Push Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.export.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image reference
        id: export
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy VPS and Run
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          envs: REGISTRY,IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script_stop: false
          script: |
            set -u
            echo "[STEP] cd deploy path"
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ -d .git ]; then
              echo "[STEP] git pull"
              git pull --ff-only origin "${{ github.ref_name }}"
            fi

            echo "[STEP] docker login ghcr"
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
            LOGIN_EXIT=$?
            if [ "$LOGIN_EXIT" -ne 0 ]; then
              echo "docker login failed with exit code $LOGIN_EXIT"
              exit "$LOGIN_EXIT"
            fi

            COMPOSE_ARGS="-f docker-compose.yml -f docker-compose.prod.yml"

            echo "[STEP] docker compose pull app worker"
            docker compose $COMPOSE_ARGS pull app worker
            PULL_EXIT=$?
            if [ "$PULL_EXIT" -ne 0 ]; then
              echo "docker compose pull failed with exit code $PULL_EXIT"
              docker compose $COMPOSE_ARGS ps || true
              exit "$PULL_EXIT"
            fi

            echo "[STEP] docker compose up -d"
            UP_OUTPUT=$(docker compose $COMPOSE_ARGS up -d --remove-orphans 2>&1)
            UP_EXIT=$?
            echo "$UP_OUTPUT"
            if [ "$UP_EXIT" -ne 0 ]; then
              echo "docker compose up failed with exit code $UP_EXIT. Printing diagnostics..."
              echo "docker compose up failed. Printing diagnostics..."
              docker compose $COMPOSE_ARGS ps || true
              docker inspect nodejs-app --format '{{json .State}}' || true
              docker inspect nodejs-worker --format '{{json .State}}' || true
              docker logs --tail=300 nodejs-app || true
              docker logs --tail=300 nodejs-worker || true
              docker compose $COMPOSE_ARGS logs --tail=200 redis postgres rabbitmq || true
              exit "$UP_EXIT"
            fi

            # Wait only for app container health to avoid false negatives from other service probes.
            ATTEMPTS=0
            MAX_ATTEMPTS=60
            until [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; do
              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nodejs-app 2>/dev/null || echo 'missing')
              echo "nodejs-app status: $STATUS"

              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "missing" ]; then
                echo "App failed to become healthy. Printing diagnostics..."
                docker compose $COMPOSE_ARGS ps || true
                docker inspect nodejs-app --format '{{json .State}}' || true
                docker logs --tail=300 nodejs-app || true
                docker logs --tail=300 nodejs-worker || true
                docker compose $COMPOSE_ARGS logs --tail=200 redis postgres rabbitmq || true
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for nodejs-app health. Printing diagnostics..."
              docker compose $COMPOSE_ARGS ps || true
              docker inspect nodejs-app --format '{{json .State}}' || true
              docker logs --tail=300 nodejs-app || true
              exit 1
            fi

            echo "[STEP] docker compose ps"
            docker compose $COMPOSE_ARGS ps
            PS_EXIT=$?
            if [ "$PS_EXIT" -ne 0 ]; then
              echo "docker compose ps failed with exit code $PS_EXIT"
              exit "$PS_EXIT"
            fi

            echo "[DONE] Deploy script completed successfully"

  monitor:
    name: Monitor (post-deploy)
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deployment result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed"
            exit 1
          fi
