services:
  app:
    restart: always
    mem_limit: 512m
    cpus: 0.50
    ports:
      - "3008:3008"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: always
    mem_limit: 384m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    restart: always
    mem_limit: 1024m
    cpus: 0.75
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=120"]
    ports: []
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: always
    mem_limit: 256m
    cpus: 0.25
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis"]
    ports: []
    healthcheck:
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: always
    mem_limit: 512m
    cpus: 0.40
    ports: []
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    profiles: ["https"]
    restart: always
    mem_limit: 256m
    cpus: 0.20
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
